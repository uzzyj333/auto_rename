[monitoring]
; watch_dir = /mnt/media/test
; watch_dir = F:\XunLeiDownLoad\FDM
; output_dir = /mnt/media/processed
; poll_interval = 10
supported_extensions = .mp4,.mkv,.avi,.mov,.wmv,.flv,.ts,.m2ts,.iso,.strm,.webm,.m4v,.mpg,.mpeg,.rmvb,.srt,.ass,.ssa,.vtt,.sub
; use_polling = False
; polling_interval = 5
; 路径映射：将下载器返回的路径映射到主机实际路径
; path_mappings = F:\\XunLeiDownLoad\\media:F:\\XunLeiDownLoad\\media

; 目录监控配置
; enable_directory_monitor: 是否启用目录监控（True/False）
enable_directory_monitor = True
; directory_watch_dir: 要监控的目录路径
directory_watch_dir = C:\Users\YourName\Downloads\YourShow
; directory_output_dir: 整理后的输出目录
directory_output_dir = C:\Users\YourName\Downloads\YourShow
; directory_organize_mode: 整理方式（copy=复制，move=移动）
directory_organize_mode = move
; directory_scrape_metadata: 是否刮削元数据并保存到文件（True/False）
directory_scrape_metadata = False
; directory_metadata_format: 元数据文件格式（nfo/json/both）
; ; directory_metadata_format = nfo
; ; ; directory_polling_interval: 目录监控轮询间隔（秒）
; directory_polling_interval = 5

[naming]
; tv_show_format = {show_name}/Season {season:02d}/{show_name} - S{season:02d}E{episode:02d} - {episode_name}
; tv_show_format = {show_name} ({year}) {tmdbid=tmdbid}/Season {season:02d}/{show_name} {season_episode} {quality_tags}
tv_show_format = {show_name} ({year}) {tmdbid=tmdbid}/Season {season:02d}/{show_name} {season_episode}
movie_format = Movies/{show_name} ({year}) {tmdbid=tmdbid}/{show_name} {quality_tags}{release_group_suffix}
; anime_format = Anime/{show_name}/{show_name} - {episode:03d}
simple_format = {title}

[tmdb]
api_key = your_tmdb_api_key
language = zh-CN
region = CN
retry_count = 3
timeout = 30
base_url = https://api.themoviedb.org/3

; LLM 兜底识别配置（当 TMDB/正则无法识别时使用）
[llm_fallback]
enabled = False
max_concurrent = 2

; ===== Provider 1: 智谱 GLM =====
[llm_provider_1]
name = GLM
api_url = https://open.bigmodel.cn/api/paas/v4/chat/completions
api_key = 
model = glm-4-flash
enabled = True
weight = 1
timeout = 30
max_retries = 2

; ===== Provider 2: DeepSeek =====
[llm_provider_2]
name = DeepSeek
api_url = https://api.deepseek.com/v1/chat/completions
api_key = sk-xxx
model = deepseek-chat
enabled = False
weight = 1
timeout = 30
max_retries = 2

; ===== Provider 3: OpenAI =====
[llm_provider_3]
name = OpenAI
api_url = https://api.openai.com/v1/chat/completions
api_key = sk-xxx
model = gpt-4o-mini
enabled = False
weight = 1
timeout = 30
max_retries = 2

; GuessIt 增强识别配置
; GuessIt 是一个专业的视频文件名解析库，能够从文件名中提取丰富的元数据
; 启用后可以显著提高识别准确率，特别是对于非标准命名格式
[guessit]
; 是否启用 GuessIt 增强识别
enabled = True
; 是否优先使用 GuessIt 结果（False 时以正则表达式为主，GuessIt 作为补充）
prefer_guessit = False

[emos]
auth_token = 
base_url = https://emos.best
; 文件存储类型: internal / global / default / google_drive / zn_r2_upload
file_storage = internal
; 在线上传页面可选的存储列表（用逗号分隔）
file_storages = internal,default,google_drive,zn_r2_upload
; 分片大小(MB)，范围: 10-200，默认: 200（参考 auto_rename；减少请求次数）
chunk_size_mb = 200
; 单文件分片并发上限（1-32），默认: 10
; 上传时从 4 路起步，成功后逐步升到该值；遇到 429/5xx/断线会自动减半退避。
; 多个文件同时上传时全局最多 16 路，避免连接数叠加触发站点限流。
upload_concurrency = 10
; 视频上传成功后是否顺带上传同目录同名的外挂字幕（.srt/.ass/.ssa/.vtt/.sub）
upload_subtitles = True
; 请求超时时间（秒）
timeout = 60

; 在线识别上传（浏览服务器视频 -> 识别 Emos 条目 -> 直接上传）
[online_upload]
; 允许浏览/上传的视频根目录，多个用逗号分隔；留空则使用监控目录
video_root = 
; 上传前是否用 ffprobe 校验并提取视频信息
probe_enabled = True
; ffprobe 可执行文件路径，留空则使用 PATH 中的 ffprobe
ffprobe_path = 
; saveInternal（内部入库）使用的 path_type
path_type = local_emos_1

; WebDAV 网盘（Telegram 里浏览网盘目录，选中文件即交给 aria2 下载）
; 用法：填好下面几项 → 开 enabled → 在 Telegram 发送 /webdav，
;       逐层点目录，点某个文件就会自动推送给 aria2；下载完成后照常自动识别上传。
;       目录页还有「📥 下载本目录 / 📥 含子目录」可批量推送（单次最多 200 个）。
[webdav]
enabled = False
; WebDAV 服务地址（含协议与端口），例如 https://dav.example.com
base_url = 
; 浏览根目录（相对 WebDAV 根，留空为根目录），例如 /tv
root_path = 
; 认证方式目前支持 Basic（用户名 / 密码）
username = 
password = 
; 自签证书的 WebDAV 可关掉证书校验（同时会让 aria2 跳过校验）
verify_ssl = True
; 默认只列视频/字幕；改成 True 会列出目录下的全部文件
show_all_files = False
; 交给哪个 aria2 实例下载：填下载器标识（如 aria2 / aria2_2），留空用第一个 aria2
downloader = 
; aria2 下载保存目录，留空使用 aria2 默认目录（建议指向监控目录，方便下载后自动识别上传）
save_dir = 
timeout = 30

[processing]
; 上传目标固定为 Emos
upload_targets = emos
delete_after_upload = True
; 最大并发上传工作线程数，默认3；在线修改后立即生效，无需重启容器
max_upload_workers = 3

[logging]
; 日志只需配置等级：DEBUG / INFO / WARNING / ERROR / CRITICAL
; 日志文件由系统自动写入统一日志目录，在 Web「日志查看」页面可直接查看，无需填写其他项。
log_level = INFO
log_file = video-organizer.log
console_log = True
file_log = True

; ===== 下载器配置 =====
; 支持同一类型配置多个实例：节名 downloader.<标识> 中的「标识」必须唯一，
; 并通过 type 字段指定真实类型。例如：
;   [downloader.aria2]      type = aria2        # 第 1 个 aria2
;   [downloader.aria2_2]    type = aria2        # 第 2 个 aria2
;   [downloader.qbittorrent] type = qbittorrent
; 在线修改下载器配置后立即生效，无需重启容器。

; [downloader.aria2]
; type = aria2
; ; 显示名称（可选，仅用于界面展示）
; name = 主 Aria2
; ; RPC 地址
; rpc_url = http://192.168.1.16:6800/jsonrpc
; ; RPC 密钥
; secret = your_secret_token
; ; 监控模式: polling (轮询), websocket (WebSocket实时), webhook (Webhook回调)
; ; - polling: 定时轮询 aria2 获取已完成的下载（兼容性最好）
; ; - websocket: 通过 WebSocket 实时接收下载完成事件（推荐，高效）
; ; - webhook: 通过 HTTP 接口接收 aria2 通知（需要配置 aria2 的 on-download-complete）
; monitor_mode = polling
; ; 路径映射：将 aria2 返回的路径映射到主机实际路径
; ; 格式: 下载器路径:本地路径（多个用逗号分隔）
; ; 示例（Docker 场景）: /downloads:F:\Downloads,/data:D:\Data
; ; 示例（远程服务器）: /mnt/downloads:\\\192.168.1.100\downloads
; ; 本机运行时无需配置
; ; path_mappings = /downloads:F:\Downloads
; ; WebSocket 断线重连延迟（秒）
; websocket_reconnect_delay = 5

; ; 第二个 aria2 实例（标识不能与上面的重复）
; [downloader.aria2_2]
; type = aria2
; name = 备用 Aria2
; rpc_url = http://192.168.1.17:6800/jsonrpc
; secret = your_secret_token

; [downloader.qbittorrent]
; type = qbittorrent
; rpc_url = http://192.168.1.16:8091/api/v2
; username = admin
; password = 123456

[telegram]
; Telegram Bot 配置：上传报错通知 + 机器人回复修正上传目标
; bot_token = 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
; chat_id = -1001234567
; channel_chat_id = -1001234568  ; 频道ID，用于发送上传完成的JSON消息（供自动下载系统解析）
; enabled = True          ; 是否启用 Telegram 通知
; reply_enabled = True    ; 是否启用机器人回复修正（长轮询接收消息）
; allowed_user_ids =      ; 允许操作的用户ID，逗号分隔，留空不限制
; poll_timeout = 30       ; getUpdates 长轮询超时（秒）
; url_download_enabled = True   ; 机器人收到的下载链接（http/https/磁力）直接推给 aria2
; url_download_downloader =     ; 推给哪个 aria2 实例（填下载器标识，如 aria2_2），留空用第一个
; url_download_save_dir =       ; aria2 保存目录，留空用 aria2 默认目录
;
; 绑定方式：填好 bot_token 后，在 Telegram 里给机器人发送 /bind 即可绑定当前会话，
; chat_id 会自动写回本文件，在线即时生效。
; 修正上传：上传失败时会推送报错信息，直接回复该条消息并发送目标，例如
;   时光代理人S04E09 / 时光代理人 第4季第9集 / 时光代理人 4x09 / 时光代理人 (2024)
